<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fffaf3">
  <title>観戦 | chopanとチン経衰弱</title>
  <link rel="stylesheet" href="/style.css">
  <script>if (location.pathname.startsWith("/obs/")) document.documentElement.classList.add("obs-page");</script>
</head>
<body class="watch-body">
  <main class="watch-shell">
    <details class="sound-settings watch-sound-settings panel">
      <summary>♪ 音設定</summary>
      <div class="sound-settings-content">
        <label><input id="watchSoundEffectsEnabled" type="checkbox"> 効果音</label>
        <label><input id="watchTurnSpeechEnabled" type="checkbox"> ターン読み上げ</label>
        <label class="sound-volume" for="watchSoundVolume">音量 <input id="watchSoundVolume" type="range" min="0" max="100" step="5"><output id="watchSoundVolumeValue" for="watchSoundVolume">55%</output></label>
      </div>
    </details>
    <nav class="watch-controls" aria-label="観戦画面の操作">
      <a class="text-button watch-back" href="/">← トップへ戻る</a>
      <p>観戦専用画面です。カードやゲームの操作はできません。</p>
    </nav>
    <header class="watch-header">
      <div class="watch-brand">
        <span class="watch-live"><i></i> LIVE</span>
        <h1>chopanと<span>チン経衰弱</span></h1>
      </div>
      <div class="watch-stats">
        <div class="watch-room-stat"><span class="top-label">ROOM</span><strong id="watchRoomCode">----</strong></div>
        <div class="turn-display"><span class="top-label">TURN</span><strong id="watchTurnName">-</strong></div>
        <div><span class="top-label">のこり</span><strong><span id="watchRemainingPairs">17</span> ペア</strong></div>
      </div>
    </header>

    <div id="watchProgress" class="game-progress watch-progress hidden" role="status" aria-live="polite">
      <span class="game-progress-badge"><i aria-hidden="true"></i>ゲーム進行中</span>
      <strong id="watchCurrentTurnStatus">現在のターン：-</strong>
      <span id="watchTurnInstruction">プレイヤーが2枚選ぶのを見守っています</span>
    </div>
    <div id="watchPlayers" class="players-bar watch-players"></div>
    <div id="watchStatus" class="watch-status">ルームに接続しています…</div>
    <section id="watchOrderGame" class="order-game panel hidden" aria-live="polite">
      <p class="eyebrow">TURN ORDER</p>
      <h2 id="watchOrderTitle">運命の1枚を選択中！</h2>
      <p id="watchOrderGuide" class="muted">プレイヤーの選択を見守っています</p>
      <div id="watchOrderCards" class="order-card-grid"></div>
      <div id="watchOrderResult" class="order-result-list hidden"></div>
    </section>
    <div id="watchEffect" class="effect-message hidden" aria-live="assertive"></div>
    <div id="watchJokerChanceBurst" class="joker-chance-burst hidden" role="status" aria-live="assertive">
      <span>はげちょぱ</span><strong>チャーーーーンス!!</strong>
    </div>
    <div id="watchRevealTimer" class="reveal-timer hidden" aria-live="polite">全カード公開 <strong>6</strong></div>
    <div id="watchCardGrid" class="card-grid watch-card-grid" aria-label="観戦中のカード盤面"></div>

    <section id="watchResult" class="watch-result panel hidden" aria-labelledby="watchResultTitle">
      <div>
        <p class="eyebrow">GAME FINISH</p>
        <h2 id="watchResultTitle">結果発表！</h2>
      </div>
      <div id="watchRanking" class="ranking watch-ranking"></div>
    </section>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/card-view.js"></script>
  <script src="/sound-manager.js?v=20261023-ios-speech"></script>
  <script src="/watch.js?v=20261017-auto-hide-match"></script>
</body>
</html>
